name: CI

# Every pull request, and every push to main (which Cloudflare deploys), must
# lint, pass the tests and build before it can be trusted.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the build as search engines see it
        run: node scripts/check-build.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
